name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"       # once a day
  workflow_dispatch:           # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Clone the official trophy generator
        run: git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git trophy-src

      - name: Generate trophy.svg
        working-directory: trophy-src
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts tushar598 ../trophy.svg dracula

      - name: Commit and push trophy.svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update trophy.svg"
          file_pattern: trophy.svg
